version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: landshield-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: landshield
    ports:
      - "5433:5432"
    volumes:
      - landshield_pgdata:/var/lib/postgresql/data

volumes:
  landshield_pgdata:
